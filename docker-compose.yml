# Clippzz on the Raspberry Pi. Start with:  docker compose up -d --build
#
# Storage care: scratch files live in RAM (tmpfs), code is mounted read-only,
# and container logs are capped, so the only regular disk writes are the
# small SQLite database and compressed transcripts under /data.
x-common: &common
  image: clippzz:latest
  user: "1000:1000"
  restart: unless-stopped
  volumes:
    - ./:/app:ro
    - /data:/data
  logging:
    driver: json-file
    options: { max-size: "2m", max-file: "2" }

services:
  web:
    <<: *common
    build: .
    command: uvicorn clippzz.web:app --host 0.0.0.0 --port 8787 --no-access-log
    ports:
      - "8787:8787"
    tmpfs:
      - /work:size=16m,uid=1000,gid=1000
    cpus: 1.0
    mem_limit: 256m

  worker:
    <<: *common
    command: python -m clippzz.worker
    volumes:
      - ./:/app:ro
      - /data:/data
      # Meme sounds and music the owner drops in from the Mac (SSD share).
      - /srv/storage/Clippzz:/library:ro
    env_file:
      - ${HOME}/.clippzz.env
    tmpfs:
      - /work:size=384m,uid=1000,gid=1000
    # Capped so other services on this Pi keep a core. Speech-to-text runs
    # three threads and slows down about fourfold if the cap is below three
    # cores, so keep cpus and CLIPPZZ_WHISPER_THREADS in step.
    cpus: 3.0
    mem_limit: 1536m
    depends_on:
      - web
